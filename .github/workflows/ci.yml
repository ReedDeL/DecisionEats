name: ci

on: [pull_request, push]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify catalog structure
        run: node supabase/tests/catalog_structural_verification.mjs
      - name: Verify catalog source boundary
        run: node scripts/catalog-boundary-verification.mjs --self-test

  rls-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start --yes
      - name: Reset local database
        run: npx supabase db reset --local --no-seed --yes
      - name: Verify catalog activation serialization
        run: bash supabase/tests/catalog_activation_concurrency.sh
      - name: Verify RLS policies
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/rls_verification.sql
      - name: Verify protected catalog
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/catalog_verification.sql
      - name: Verify journey schema
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/journey_schema_verification.sql

      - name: Verify multi-meal plan persistence and ownership
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/weekly_slots_verification.sql

      - name: Verify pantry sync and account isolation
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/pantry_sync_verification.sql

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy pytest pydantic requests types-requests anyio typeguard
      - run: ruff format --check tools/
      - run: ruff check tools/
      - run: mypy --strict tools/catalog
      - run: pytest tools/

  # Fails the build if a secret was ever committed. Cheap insurance against the
  # one mistake in this repo that cannot be undone by a revert.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate every key it held."
            exit 1
          fi
      - name: Check for service-role keys and private keys in tracked files
        run: |
          if git grep -nIE '(SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=]|service_role(_key)?[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.example' ':!.github/workflows/ci.yml'; then
            echo "::error::A service-role key or private key appears in a tracked file."
            exit 1
          fi
